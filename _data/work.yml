#    tags     : list of small pills
#    desc     : one/two sentence description
#    link     : where the button goes
#    cta      : button label
#    icon     : Font Awesome class for the button arrow (optional,
#               defaults to fa-solid fa-arrow-right)
#    internal : true if the link is an on-page anchor (#section) — then
#               it opens in the same tab instead of a new one
#    accent   : "blue" (default) or "clay" — card colour theme
#    images   : ZERO or more pictures. They render in the card art with a
#               subtle hover effect. If omitted, the card art shows the
#               `icon` as a large glyph instead.
# ============================================================

